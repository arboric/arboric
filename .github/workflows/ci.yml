name: CI

on:
  push:
    paths:
      - "src/**"
      - "test/**"
      - "tests/**"
      - "Cargo.*"
      - "README.md"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

env:
  # We use environment variables to specify the Rust version and other settings once
  RUST_TOOLCHAIN: 1.99.0
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          # The action sets RUSTFLAGS="-D warnings" by default. Remove this
          # line after the existing warnings are fixed.
          rustflags: ""

      - name: Check formatting
        run: cargo fmt -- --check

      # TODO: add `-- -D warnings` after the existing clippy warnings are fixed.
      - name: Run clippy
        run: cargo clippy --all-targets

      - name: Run tests
        run: cargo test
