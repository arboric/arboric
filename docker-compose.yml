version: "3"
volumes:
  influxdb-data:
  grafana-data:
services:
  test_api:
    build:
      context: .
      dockerfile: heroes-api/Dockerfile
    container_name: test_api
    ports:
      - 3001:3001
  influxdb:
    image: influxdb:3.11-core
    # Local development only: authentication is disabled
    command: influxdb3 serve --without-auth --data-dir /var/lib/influxdb3
    ports:
      - 8086:8086
    environment:
      INFLUXDB3_NODE_ID: node0
      INFLUXDB3_OBJECT_STORE: file
      INFLUXDB3_HTTP_BIND_ADDR: 0.0.0.0:8086
    volumes:
      - influxdb-data:/var/lib/influxdb3
    container_name: influxdb
  grafana:
    image: grafana/grafana
    user: "104"
    links:
      - influxdb:influxdb
    depends_on:
      - influxdb
    ports:
      - 3000:3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./etc/grafana/provisioning/:/etc/grafana/provisioning/
    env_file:
      - ./etc/grafana/config.monitoring
    container_name: grafana
    restart: always
