[package]
name = "arboric"
version = "0.2.1"
authors = ["Alistair A. Israel <aisrael@gmail.com>"]
edition = "2024"
rust-version = "1.99"

[dependencies]
base64 = "0.23.1"
frank_jwt = "3.1.1"
graphql-parser = "0.2.3"
hex = "0.4.0"
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server-graceful", "client-legacy", "http1"] }
influx_db_client = "0.3.6"
log = { version = "0.4", features = ["serde"] }
mime = "0.3.18"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
yaml_serde = "0.10.7"
simplelog = "0.12.2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
clap = { version = "4.6.7", features = ["cargo"] }

[workspace]
members = ["heroes-api"]
